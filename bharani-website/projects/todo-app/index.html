<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple todo application for creating and managing daily tasks.">
  <title>My Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-icon">
        <svg width="48" height="48" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0f766e"/>
              <stop offset="100%" stop-color="#14b8a6"/>
            </linearGradient>
          </defs>
          <rect x="10" y="10" width="44" height="50" rx="7" stroke="url(#lg)" stroke-width="2.5" fill="rgba(15,118,110,0.08)"/>
          <rect x="22" y="5" width="20" height="12" rx="4" fill="url(#lg)"/>
          <line x1="20" y1="30" x2="44" y2="30" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
          <line x1="20" y1="39" x2="36" y2="39" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round" opacity="0.4"/>
          <circle cx="46" cy="46" r="11" fill="white" stroke="url(#lg)" stroke-width="2"/>
          <polyline points="40,46 44,50 52,41" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>My Todo App</h1>
      <p class="login-subtitle">Enter your username to access your tasks from any device</p>
      <form id="loginForm">
        <input
          type="text"
          id="usernameInput"
          placeholder="Enter your username"
          autocomplete="off"
          maxlength="30"
          required
        />
        <button type="submit" id="loginButton">Continue →</button>
      </form>
      <p class="login-hint">New username? We'll create your list automatically.</p>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <main class="container" id="appScreen" style="display:none;">

    <header class="app-header">
      <div class="header-top">
        <div>
          <h1>My Todo App</h1>
          <p class="app-subtitle">Logged in as <strong id="displayUsername"></strong></p>
        </div>
        <button id="logoutBtn" title="Switch user">⇄ Switch</button>
      </div>
    </header>

    <form id="todoForm">
      <label for="todoInput" class="sr-only">Enter a new task</label>
      <div class="input-group">
        <input type="text" id="todoInput" name="todo" placeholder="Enter a task..." autocomplete="off" maxlength="100" required>
        <button type="submit" id="addButton">Add Task</button>
      </div>
    </form>

    <section class="task-section" aria-labelledby="taskHeading">
      <div class="task-header">
        <h2 id="taskHeading">Your Tasks</h2>
        <span id="taskCount" aria-live="polite">0 tasks</span>
      </div>
      <p id="loadingMessage">Loading your tasks...</p>
      <p id="emptyMessage" style="display:none;">No tasks yet. Add your first task above.</p>
      <ul id="todoList" aria-live="polite"></ul>
    </section>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
