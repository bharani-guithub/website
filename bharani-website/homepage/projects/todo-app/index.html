<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-icon">
        <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0f766e"/>
              <stop offset="100%" stop-color="#14b8a6"/>
            </linearGradient>
          </defs>
          <rect x="10" y="10" width="44" height="50" rx="7" stroke="url(#lg)" stroke-width="2.5" fill="rgba(15,118,110,0.08)"/>
          <rect x="22" y="5" width="20" height="12" rx="4" fill="url(#lg)"/>
          <line x1="20" y1="30" x2="44" y2="30" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
          <line x1="20" y1="39" x2="36" y2="39" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round" opacity="0.4"/>
          <circle cx="46" cy="46" r="11" fill="white" stroke="url(#lg)" stroke-width="2"/>
          <polyline points="40,46 44,50 52,41" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Todo App</h1>
      <p class="login-subtitle">Enter your username to sync tasks across all your devices</p>
      <form id="loginForm">
        <input type="text" id="usernameInput" placeholder="Username" autocomplete="off" maxlength="30" required/>
        <button type="submit" id="loginButton">Get Started →</button>
      </form>
      <p class="login-hint">No account needed — your username is your key.</p>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <main class="app" id="appScreen" style="display:none;">

    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <span class="header-logo">✦</span>
        <div>
          <h1 class="app-title">My Tasks</h1>
          <p class="app-user">@<span id="displayUsername"></span></p>
        </div>
      </div>
      <div class="header-right">
        <button id="themeToggle">🌙 Dark</button>
        <button id="logoutBtn">⇄ Switch</button>
      </div>
    </header>

    <!-- Dashboard -->
    <div class="dashboard">
      <div class="dash-card high">
        <span class="dash-count" id="countHigh">0</span>
        <span class="dash-label">High</span>
      </div>
      <div class="dash-card medium">
        <span class="dash-count" id="countMedium">0</span>
        <span class="dash-label">Medium</span>
      </div>
      <div class="dash-card low">
        <span class="dash-count" id="countLow">0</span>
        <span class="dash-label">Low</span>
      </div>
    </div>

    <!-- Add task form -->
    <div class="add-task-bar">
      <input type="text" id="todoInput" placeholder="Add a new task…" autocomplete="off" maxlength="100"/>
      <select id="prioritySelect">
        <option value="medium">🟡 Medium</option>
        <option value="high">🔴 High</option>
        <option value="low">🟢 Low</option>
      </select>
      <button id="addButton" type="button">+ Add</button>
    </div>

    <!-- Task list -->
    <div class="task-area">
      <div class="task-area-header">
        <span class="task-area-title">Tasks</span>
        <span id="taskCount" class="task-count-badge">0</span>
        <span class="drag-hint">drag to reorder</span>
      </div>
      <p id="loadingMessage" class="state-msg">Loading your tasks…</p>
      <p id="emptyMessage" class="state-msg" style="display:none;">No tasks yet. Add one above!</p>
      <ul id="todoList"></ul>
    </div>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
