<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A simple todo application for creating and managing daily tasks.">

    <title>My Todo App</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">

        <header class="app-header">
            <h1>My Todo App</h1>
            <p class="app-subtitle">Organize your tasks and stay productive.</p>
        </header>

        <form id="todoForm">
            <label for="todoInput" class="sr-only">
                Enter a new task
            </label>

            <div class="input-group">
                <input type="text" id="todoInput" name="todo" placeholder="Enter a task..." autocomplete="off"
                    maxlength="100" required>

                <button type="submit" id="addButton">
                    Add Task
                </button>
            </div>
        </form>

        <section class="task-section" aria-labelledby="taskHeading">
            <div class="task-header">
                <h2 id="taskHeading">Your Tasks</h2>

                <span id="taskCount" aria-live="polite">
                    0 tasks
                </span>
            </div>

            <p id="emptyMessage">
                No tasks yet. Add your first task above.
            </p>

            <ul id="todoList" aria-live="polite"></ul>
        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
